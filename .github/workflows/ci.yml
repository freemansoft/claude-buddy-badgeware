# Lint, MicroPython syntax check, the host tests and the Markdown
# format check on each pull request and each push to main. The same
# commands as the README's "Checks on the host".
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # vendor/: Pimoroni's ruff rules and firmware source

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7 # for prettier
        with:
          node-version: "26"

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Lint (Pimoroni's ruff rules, ruff.toml)
        run: ruff check --output-format github .

      - name: MicroPython syntax
        run: find apps/claude_buddy -name '*.py' -print0 | xargs -0 -n1 python -m mpy_cross -o /dev/null

      - name: Tests (host)
        run: python -m unittest discover -s tests -v

      # The same check as .githooks/pre-commit, for everyone: committed
      # Markdown (git ls-files skips the vendor/ submodules) must be
      # prettier-formatted, with the version in .prettier-version.
      - name: Markdown formatting (prettier)
        run: git ls-files -z '*.md' | xargs -0 npx --yes prettier@$(cat .prettier-version) --config .prettierrc.json --check
