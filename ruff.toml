# Lint rules for the whole repo: Pimoroni's own (the file their badge
# firmware CI uses, identical in vendor/tufty2350 and vendor/badger2350),
# so the app reads like the stock apps and the tools and tests follow the
# same rules. extend takes one file; tests/project/test_ruff_config.py
# fails if the Tufty's and the Badger's ever differ.
# Needs the submodules: git submodule update --init
#
#   .venv/bin/ruff check .
#
# ruff format is not used: Pimoroni's firmware CI only runs ruff check
# (vendor/*/ci/python.sh), and the formatter would rewrite most files.
extend = "vendor/tufty2350/ci/ruff.toml"

# The firmware is Pimoroni's to lint.
extend-exclude = ["vendor"]

[lint.per-file-ignores]
# Tests poke at internals and use loose stand-in signatures.
"tests/*" = ["SLF001", "ARG002"]
